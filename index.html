<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Geri Sayım ❤️</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow-x:hidden;
      color:white;
      background: url("bg.jpg") no-repeat center center fixed;
      background-size: cover;
      position: relative;
      padding:20px;
    }

    body::before{
      content:"";
      position:absolute;
      inset:0;
      background: rgba(0,0,0,0.55);
      z-index:0;
    }

    .container{
      position:relative;
      z-index:1;
      width:100%;
      max-width:1000px;
      text-align:center;
      padding:20px;
    }

    h1{
      font-size:2.4rem;
      margin-bottom:35px;
      color:#ff4d6d;
      text-shadow:0 0 10px rgba(0,0,0,0.35);
    }

    .countdown{
      display:flex;
      justify-content:center;
      flex-wrap:wrap;
      gap:20px;
    }

    .box{
      background: rgba(0,0,0,0.45);
      padding:25px;
      border-radius:20px;
      min-width:120px;
      backdrop-filter: blur(5px);
      box-shadow:0 8px 25px rgba(0,0,0,0.25);
    }

    .number{
      font-size:3rem;
      font-weight:bold;
    }

    .label{
      margin-top:10px;
      font-size:1rem;
      color:#ddd;
    }

    .heart{
      margin-top:35px;
      font-size:1.4rem;
      color:#ff4d6d;
      animation:pulse 1.5s infinite;
    }

    /* SANDIK ALANI */
    .chest-area{
      margin-top:45px;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:16px;
      position:relative;
    }

    .chest-title{
      font-size:1.15rem;
      color:#ffd6de;
    }

    /* KÜÇÜK SANDIK */
    .chest-wrapper{
      position:relative;
      width:170px;
      height:130px;
      cursor:pointer;
      transition:transform .25s ease;
      perspective:1000px;
    }

    .chest-wrapper:hover{
      transform:scale(1.03);
    }

    .chest-lid{
      position:absolute;
      top:0;
      left:8px;
      width:154px;
      height:58px;
      background: linear-gradient(to bottom, #8b5a2b, #6f431f);
      border:4px solid #4b2e16;
      border-bottom:none;
      border-radius:90px 90px 16px 16px;
      z-index:3;
      transform-origin: bottom center;
      transition: transform 0.8s ease;
      box-shadow: inset 0 8px 0 rgba(255,255,255,0.08);
    }

    .chest-wrapper.open .chest-lid{
      transform: rotateX(-120deg);
    }

    .chest-lid::before,
    .chest-lid::after{
      content:"";
      position:absolute;
      top:0;
      width:14px;
      height:100%;
      background:#d4a437;
      border-left:2px solid #9b6d12;
      border-right:2px solid #9b6d12;
    }

    .chest-lid::before{ left:22px; }
    .chest-lid::after{ right:22px; }

    .chest-base{
      position:absolute;
      bottom:0;
      left:0;
      width:170px;
      height:78px;
      background: linear-gradient(to bottom, #7b4a22, #5b3418);
      border:4px solid #4b2e16;
      border-radius:16px;
      z-index:1;
      box-shadow: inset 0 10px 0 rgba(255,255,255,0.05);
      overflow:visible;
    }

    .chest-base::before,
    .chest-base::after{
      content:"";
      position:absolute;
      top:0;
      width:16px;
      height:100%;
      background:#d4a437;
      border-left:2px solid #9b6d12;
      border-right:2px solid #9b6d12;
    }

    .chest-base::before{ left:26px; }
    .chest-base::after{ right:26px; }

    .lock{
      position:absolute;
      left:50%;
      top:56px;
      transform:translateX(-50%);
      width:34px;
      height:40px;
      background:#f0c14b;
      border:3px solid #9b6d12;
      border-radius:8px;
      z-index:4;
      box-shadow:0 4px 10px rgba(0,0,0,0.2);
      transition:opacity .3s ease;
    }

    .chest-wrapper.open .lock{
      opacity:0;
    }

    .lock::before{
      content:"";
      position:absolute;
      top:-18px;
      left:50%;
      transform:translateX(-50%);
      width:20px;
      height:20px;
      border:4px solid #9b6d12;
      border-bottom:none;
      border-radius:18px 18px 0 0;
    }

    .lock::after{
      content:"";
      position:absolute;
      left:50%;
      top:15px;
      transform:translateX(-50%);
      width:7px;
      height:12px;
      background:#7a5200;
      border-radius:10px;
    }

    /* KALPLER */
    .floating-hearts{
      position:absolute;
      left:50%;
      bottom:60px;
      transform:translateX(-50%);
      width:170px;
      height:150px;
      pointer-events:none;
      z-index:10;
      overflow:visible;
    }

    .floating-heart{
      position:absolute;
      bottom:0;
      font-size:22px;
      opacity:0;
      animation: floatHeart 2.4s ease-out forwards;
    }

    .floating-heart:nth-child(1){ left:10px; animation-delay:0s; }
    .floating-heart:nth-child(2){ left:40px; animation-delay:0.15s; }
    .floating-heart:nth-child(3){ left:70px; animation-delay:0.3s; }
    .floating-heart:nth-child(4){ left:100px; animation-delay:0.45s; }
    .floating-heart:nth-child(5){ left:130px; animation-delay:0.6s; }

    .floating-hearts.hidden{
      display:none;
    }

    /* MEKTUP */
    .letter-pop{
      position:absolute;
      left:50%;
      bottom:42px;
      transform:translateX(-50%);
      width:95px;
      height:68px;
      background:#fff6f8;
      border:3px solid #e7a5b5;
      border-radius:10px;
      z-index:9;
      display:none;
      box-shadow:0 10px 20px rgba(0,0,0,0.25);
    }

    .letter-pop::before{
      content:"";
      position:absolute;
      top:0;
      left:0;
      width:100%;
      height:100%;
      background:
        linear-gradient(135deg, transparent 49%, #f3cad4 50%, transparent 51%),
        linear-gradient(225deg, transparent 49%, #f3cad4 50%, transparent 51%);
      background-size:50% 100%;
      background-repeat:no-repeat;
      background-position:left top, right top;
      border-radius:8px;
      opacity:0.9;
    }

    .letter-pop::after{
      content:"💌";
      position:absolute;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:26px;
      z-index:2;
    }

    .letter-pop.show{
      display:block;
      animation: letterRise 1.4s ease forwards;
    }

    /* ŞİFRE KUTUSU */
    .password-box{
      display:none;
      flex-direction:column;
      gap:12px;
      align-items:center;
      width:min(90%, 360px);
      background: rgba(0,0,0,0.45);
      padding:20px;
      border-radius:18px;
      backdrop-filter: blur(5px);
      animation:fadeIn .4s ease;
    }

    .password-box.show{
      display:flex;
    }

    .password-box input{
      width:100%;
      padding:14px 16px;
      border:none;
      outline:none;
      border-radius:12px;
      font-size:1rem;
      text-align:center;
      background: rgba(255,255,255,0.95);
      color:#111;
    }

    .password-box button{
      border:none;
      background:#ff4d6d;
      color:white;
      padding:12px 24px;
      border-radius:12px;
      cursor:pointer;
      font-size:1rem;
      font-weight:bold;
      transition:0.25s;
    }

    .password-box button:hover{
      background:#ff2f56;
    }

    .error{
      min-height:20px;
      color:#ffd4dc;
      font-size:0.95rem;
    }

    /* NOT MODAL */
    .note-modal{
      position:fixed;
      inset:0;
      background: rgba(0,0,0,0.65);
      display:none;
      align-items:center;
      justify-content:center;
      z-index:999;
      padding:20px;
    }

    .note-modal.show{
      display:flex;
    }

    /* PARŞÖMEN KAĞIT */
    .note-card{
      position:relative;
      width:min(95%, 760px);
      max-height:85vh;
      overflow-y:auto;
      color:#4e3422;
      border-radius:18px;
      padding:42px 30px 34px;
      text-align:left;
      animation:fadeIn .35s ease;
      background:
        radial-gradient(circle at top left, rgba(255,255,255,0.35), transparent 35%),
        radial-gradient(circle at bottom right, rgba(120,72,24,0.12), transparent 30%),
        linear-gradient(180deg, #f7e7bd 0%, #efd8a2 45%, #e6c98c 100%);
      border:2px solid #b3874c;
      box-shadow:
        0 20px 50px rgba(0,0,0,0.35),
        inset 0 0 40px rgba(120,72,24,0.12),
        inset 0 0 0 2px rgba(255,248,220,0.25);
    }

    .note-card::before{
      content:"";
      position:absolute;
      inset:12px;
      border:1px solid rgba(120,72,24,0.25);
      border-radius:12px;
      pointer-events:none;
    }

    .note-card::after{
      content:"";
      position:absolute;
      inset:0;
      border-radius:18px;
      background:
        repeating-linear-gradient(
          180deg,
          rgba(110,70,30,0.035) 0px,
          rgba(110,70,30,0.035) 2px,
          transparent 2px,
          transparent 8px
        );
      mix-blend-mode:multiply;
      pointer-events:none;
      opacity:0.55;
    }

    .note-card h2{
      text-align:center;
      color:#7a3e12;
      margin-bottom:24px;
      font-size:2rem;
      font-family: Georgia, "Times New Roman", serif;
      letter-spacing:0.5px;
      text-shadow:0 1px 0 rgba(255,255,255,0.3);
      position:relative;
      z-index:1;
    }

    .note-card p{
      font-size:1.15rem;
      line-height:2;
      margin-bottom:10px;
      font-family: Georgia, "Times New Roman", serif;
      position:relative;
      z-index:1;
    }

    .close-btn{
      position:absolute;
      top:12px;
      right:12px;
      width:38px;
      height:38px;
      border:none;
      border-radius:50%;
      background:#8b5a2b;
      color:#fff7e6;
      font-size:1.1rem;
      cursor:pointer;
      font-weight:bold;
      z-index:3;
      box-shadow:0 4px 10px rgba(0,0,0,0.18);
    }

    .close-btn:hover{
      background:#6f431f;
    }

    @keyframes pulse{
      0%{transform:scale(1);}
      50%{transform:scale(1.08);}
      100%{transform:scale(1);}
    }

    @keyframes fadeIn{
      from{
        opacity:0;
        transform:translateY(10px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    @keyframes floatHeart{
      0%{
        transform:translateY(0) scale(0.7);
        opacity:0;
      }
      15%{
        opacity:1;
      }
      100%{
        transform:translateY(-130px) scale(1.2) rotate(12deg);
        opacity:0;
      }
    }

    @keyframes letterRise{
      0%{
        opacity:0;
        transform:translateX(-50%) translateY(20px) scale(0.7);
      }
      20%{
        opacity:1;
      }
      100%{
        opacity:1;
        transform:translateX(-50%) translateY(-120px) scale(1.05);
      }
    }

    @media (max-width:768px){
      h1{
        font-size:1.8rem;
      }

      .number{
        font-size:2.2rem;
      }

      .box{
        min-width:100px;
        padding:20px;
      }

      .note-card{
        padding:38px 20px 28px;
      }

      .note-card h2{
        font-size:1.6rem;
      }

      .note-card p{
        font-size:1.05rem;
        line-height:1.85;
      }

      .chest-wrapper{
        transform:scale(0.95);
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Şahsi Açayımla 🧿 Kavuşmamıza Kalan Süre ❤️</h1>

    <div class="countdown">
      <div class="box">
        <div class="number" id="days">0</div>
        <div class="label">Gün</div>
      </div>

      <div class="box">
        <div class="number" id="hours">0</div>
        <div class="label">Saat</div>
      </div>

      <div class="box">
        <div class="number" id="minutes">0</div>
        <div class="label">Dakika</div>
      </div>

      <div class="box">
        <div class="number" id="seconds">0</div>
        <div class="label">Saniye</div>
      </div>
    </div>

    <div class="heart">❤️ Sayılı Gün İnşallah Çabuk Geçer ❤️</div>

    <div class="chest-area">
      <div class="chest-title">Kilitli Sandık</div>

      <div class="chest-wrapper" id="chest" onclick="openChestAnimation()">
        <div class="floating-hearts hidden" id="floatingHearts">
          <div class="floating-heart">❤️</div>
          <div class="floating-heart">💖</div>
          <div class="floating-heart">💕</div>
          <div class="floating-heart">💗</div>
          <div class="floating-heart">💘</div>
        </div>

        <div class="letter-pop" id="letterPop"></div>

        <div class="chest-lid"></div>
        <div class="chest-base"></div>
        <div class="lock"></div>
      </div>

      <div class="password-box" id="passwordBox">
        <input type="password" id="passwordInput" placeholder="Şifreyi gir..." />
        <button onclick="checkPassword()">Aç</button>
        <div class="error" id="errorText"></div>
      </div>
    </div>
  </div>

  <div class="note-modal" id="noteModal">
    <div class="note-card">
      <button class="close-btn" onclick="closeNote()">✕</button>
      <h2>Not ❤️</h2>

      <p>Sözler</p>
      <p>Kremşanti sözü</p>
      <p>6 tane ısırıklar öpücük sözü</p>
      <p>Bir de Azra hanımın iddası</p>
    </div>
  </div>

  <audio id="bgMusic" src="music.mp3" loop></audio>

  <script>
    const targetDate = new Date("2026-09-20T14:30:00").getTime();
    const correctPassword = "29112007";
    let chestOpened = false;

    function updateCountdown() {
      const now = new Date().getTime();
      const distance = targetDate - now;

      if (distance <= 0) {
        document.querySelector(".container").innerHTML = "<h1>❤️ Kavuşma Zamanı ❤️</h1>";
        return;
      }

      const days = Math.floor(distance / (1000 * 60 * 60 * 24));
      const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((distance % (1000 * 60)) / 1000);

      document.getElementById("days").textContent = days;
      document.getElementById("hours").textContent = hours;
      document.getElementById("minutes").textContent = minutes;
      document.getElementById("seconds").textContent = seconds;
    }

    function playMusic() {
      const music = document.getElementById("bgMusic");
      music.play().catch(() => {});
    }

    function triggerHearts() {
      const hearts = document.getElementById("floatingHearts");

      hearts.classList.remove("hidden");
      hearts.innerHTML = `
        <div class="floating-heart">❤️</div>
        <div class="floating-heart">💖</div>
        <div class="floating-heart">💕</div>
        <div class="floating-heart">💗</div>
        <div class="floating-heart">💘</div>
      `;

      setTimeout(() => {
        hearts.classList.add("hidden");
      }, 2600);
    }

    function openChestAnimation() {
      const chest = document.getElementById("chest");
      const passwordBox = document.getElementById("passwordBox");

      if (!chestOpened) {
        chest.classList.add("open");
        chestOpened = true;

        playMusic();
        triggerHearts();

        setTimeout(() => {
          passwordBox.classList.add("show");
        }, 900);
      } else {
        passwordBox.classList.toggle("show");
      }
    }

    function showLetterThenNote() {
      const letter = document.getElementById("letterPop");
      letter.classList.remove("show");
      void letter.offsetWidth;
      letter.classList.add("show");

      setTimeout(() => {
        document.getElementById("noteModal").classList.add("show");
      }, 1400);
    }

    function checkPassword() {
      const input = document.getElementById("passwordInput").value.trim();
      const errorText = document.getElementById("errorText");

      if (input === correctPassword) {
        errorText.textContent = "";
        document.getElementById("passwordBox").classList.remove("show");
        showLetterThenNote();
      } else {
        errorText.textContent = "Şifre yanlış";
      }
    }

    function closeNote() {
      document.getElementById("noteModal").classList.remove("show");
    }

    document.getElementById("passwordInput").addEventListener("keydown", function(e) {
      if (e.key === "Enter") {
        checkPassword();
      }
    });

    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>

</body>
</html>
