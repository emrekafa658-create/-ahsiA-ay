<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Geri Sayım ❤️</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      color: white;
      background: url("bg.jpg") no-repeat center center fixed;
      background-size: cover;
      position: relative;
      padding: 20px;
    }

    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 1000px;
      text-align: center;
      padding: 20px;
    }

    h1 {
      font-size: 2.4rem;
      margin-bottom: 35px;
      color: #ff4d6d;
      text-shadow: 0 0 10px rgba(0,0,0,0.35);
    }

    .countdown {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 20px;
    }

    .box {
      background: rgba(0, 0, 0, 0.45);
      padding: 25px;
      border-radius: 20px;
      min-width: 120px;
      backdrop-filter: blur(5px);
      box-shadow: 0 8px 25px rgba(0,0,0,0.25);
    }

    .number {
      font-size: 3rem;
      font-weight: bold;
    }

    .label {
      margin-top: 10px;
      font-size: 1rem;
      color: #ddd;
    }

    .heart {
      margin-top: 35px;
      font-size: 1.4rem;
      color: #ff4d6d;
      animation: pulse 1.5s infinite;
    }

    /* Sandık alanı */
    .chest-area {
      margin-top: 45px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .chest-title {
      font-size: 1.2rem;
      color: #ffd6de;
    }

    .chest {
      font-size: 5rem;
      cursor: pointer;
      transition: 0.25s;
      user-select: none;
    }

    .chest:hover {
      transform: scale(1.08);
    }

    .password-box {
      display: none;
      flex-direction: column;
      gap: 12px;
      align-items: center;
      width: min(90%, 360px);
      background: rgba(0, 0, 0, 0.45);
      padding: 20px;
      border-radius: 18px;
      backdrop-filter: blur(5px);
    }

    .password-box.show {
      display: flex;
    }

    .password-box input {
      width: 100%;
      padding: 14px 16px;
      border: none;
      outline: none;
      border-radius: 12px;
      font-size: 1rem;
      text-align: center;
      background: rgba(255,255,255,0.95);
      color: #111;
    }

    .password-box button {
      border: none;
      background: #ff4d6d;
      color: white;
      padding: 12px 24px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: bold;
      transition: 0.25s;
    }

    .password-box button:hover {
      background: #ff2f56;
    }

    .error {
      min-height: 20px;
      color: #ffd4dc;
      font-size: 0.95rem;
    }

    /* Not ekranı */
    .note-modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
      padding: 20px;
    }

    .note-modal.show {
      display: flex;
    }

    .note-card {
      position: relative;
      width: min(95%, 700px);
      max-height: 85vh;
      overflow-y: auto;
      background: #fff4f7;
      color: #222;
      border-radius: 24px;
      padding: 30px 24px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.35);
      text-align: left;
    }

    .note-card h2 {
      text-align: center;
      color: #ff4d6d;
      margin-bottom: 20px;
      font-size: 2rem;
    }

    .note-card p {
      font-size: 1.1rem;
      line-height: 1.8;
      margin-bottom: 10px;
    }

    .close-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 38px;
      height: 38px;
      border: none;
      border-radius: 50%;
      background: #ff4d6d;
      color: white;
      font-size: 1.1rem;
      cursor: pointer;
      font-weight: bold;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }

    @media (max-width: 768px) {
      h1 {
        font-size: 1.8rem;
      }

      .number {
        font-size: 2.2rem;
      }

      .box {
        min-width: 100px;
        padding: 20px;
      }

      .chest {
        font-size: 4.2rem;
      }

      .note-card h2 {
        font-size: 1.6rem;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Şahsi Açayımla 🧿 Kavuşmamıza Kalan Süre ❤️</h1>

    <div class="countdown">
      <div class="box">
        <div class="number" id="days">0</div>
        <div class="label">Gün</div>
      </div>

      <div class="box">
        <div class="number" id="hours">0</div>
        <div class="label">Saat</div>
      </div>

      <div class="box">
        <div class="number" id="minutes">0</div>
        <div class="label">Dakika</div>
      </div>

      <div class="box">
        <div class="number" id="seconds">0</div>
        <div class="label">Saniye</div>
      </div>
    </div>

    <div class="heart">❤️ Sayılı Gün İnşallah Çabuk Geçer ❤️</div>

    <div class="chest-area">
      <div class="chest-title">Kilitli Sandık </div>
      <div class="chest" onclick="togglePasswordBox()">📦</div>

      <div class="password-box" id="passwordBox">
        <input type="password" id="passwordInput" placeholder="Şifreyi gir..." />
        <button onclick="openChest()">Aç</button>
        <div class="error" id="errorText"></div>
      </div>
    </div>
  </div>

  <div class="note-modal" id="noteModal">
    <div class="note-card">
      <button class="close-btn" onclick="closeNote()">✕</button>
      <h2>Not ❤️</h2>

      <p>Sözler</p>
      <p>Kremşanti sözü</p>
      <p>6 tane ısırıklar öpücük sözü</p>
      <p>Bir de Azra hanımın iddası</p>
    </div>
  </div>

  <script>
    const targetDate = new Date("2026-09-20T14:30:00").getTime();
    const correctPassword = "29112007";

    function updateCountdown() {
      const now = new Date().getTime();
      const distance = targetDate - now;

      if (distance <= 0) {
        document.querySelector(".container").innerHTML = "<h1>❤️ Kavuşma Zamanı ❤️</h1>";
        return;
      }

      const days = Math.floor(distance / (1000 * 60 * 60 * 24));
      const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((distance % (1000 * 60)) / 1000);

      document.getElementById("days").textContent = days;
      document.getElementById("hours").textContent = hours;
      document.getElementById("minutes").textContent = minutes;
      document.getElementById("seconds").textContent = seconds;
    }

    function togglePasswordBox() {
      document.getElementById("passwordBox").classList.toggle("show");
      document.getElementById("errorText").textContent = "";
    }

    function openChest() {
      const input = document.getElementById("passwordInput").value.trim();
      const errorText = document.getElementById("errorText");

      if (input === correctPassword) {
        errorText.textContent = "";
        document.getElementById("noteModal").classList.add("show");
      } else {
        errorText.textContent = "Şifre yanlış";
      }
    }

    function closeNote() {
      document.getElementById("noteModal").classList.remove("show");
    }

    document.getElementById("passwordInput").addEventListener("keydown", function(e) {
      if (e.key === "Enter") {
        openChest();
      }
    });

    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>

</body>
</html>
